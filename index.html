<title>퇴근길 대탈출</title>
<style>
:root{
  --sky1:#141b3d; --sky2:#2a3670; --ink:#fdf6ec; --muted:#c9c3e6;

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{

    radial-gradient(1.5px 1.5px at 8% 12%,#fff 50%,transparent 51%),

#app{max-width:880px;margin:0 auto;padding:10px 12px 40px}
button{font:inherit}
.btn{border:0;border-radius:999px;padding:.6em 1.1em;background:#3d4a8c;color:var(--ink);cursor:pointer;font-weight:700;box-shadow:0 3px 0 #0003;transition:transform .1s}
.btn:active{transform:translateY(2px)}
.btn.primary{background:var(--pink);color:#4a2340}
.btn.big{font-size:1.15rem;padding:.8em 1.6em}
.btn.hint{background:var(--lamp);color:#5a3a12;white-space:nowrap;flex:0 0 auto}
.small{font-size:.8rem;color:var(--muted)}

/* 진행 표시 + 헤더 */
.prog{display:flex;flex-wrap:wrap;gap:4px;font-size:.72rem;margin-bottom:8px}
.pstep{padding:3px 8px;border-radius:999px;background:#ffffff14;color:var(--muted)}
.pstep.done{background:#a8e6cf2e;color:var(--mint)}

.head{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:8px}

.sub{margin:.25em 0 0;color:var(--muted);font-size:.88rem;line-height:1.45}

/* 필드(게임 화면) — 내부 좌표는 160 x 100 */
.field{position:relative;width:100%;aspect-ratio:16/10;border-radius:18px;overflow:hidden;container-type:inline-size;
  user-select:none;-webkit-user-select:none;box-shadow:0 8px 24px #0005,inset 0 0 0 2px #ffffff18}
.field.action{touch-action:none}
.obj{position:absolute;transform:translate(-50%,-50%);line-height:1;text-align:center;z-index:2}
.obj small{display:block;font-size:2.1cqw;margin-top:.3em;color:#fff;background:#0007;padding:.25em .55em;border-radius:99px;white-space:nowrap}
.obj .tag{position:absolute;top:-.2em;right:-.6em;font-size:2.4cqw;background:#fff;border-radius:99px;padding:.15em .3em}
.obj.click{cursor:pointer;filter:drop-shadow(0 0 .12em #ffe2a8cc);transition:transform .15s}
.obj.click:hover{transform:translate(-50%,-50%) scale(1.1)}
.obj.click:active{transform:translate(-50%,-50%) scale(.95)}
.obj.decor{opacity:.85;z-index:1}
.obj.actor{z-index:3}
.hero-svg{display:inline-block;vertical-align:middle;overflow:visible}

.spin{display:inline-block;animation:spin .9s linear infinite}
.wiggle{display:inline-block;animation:wiggle .5s ease-in-out infinite alternate}
@keyframes spin{to{transform:rotate(-360deg)}}
@keyframes wiggle{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}

.bubble{position:absolute;bottom:108%;left:50%;transform:translateX(-50%);font-size:1.9cqw;background:#fff;color:#3a2f4f;

.bubble::after{content:"";position:absolute;top:100%;left:50%;margin-left:-.4em;border:.4em solid transparent;border-top-color:#fff}
.bubble.shout{background:#ffe1e1;color:#c0394f}

.pbtn:active{background:var(--pink)}
.pbtn.ok{background:var(--mint)}
.lock-msg{min-height:1.5em;color:#c2416b;font-weight:700;margin:.6em 0 0}

/* 방향 버튼 */
.dpad{display:grid;grid-template-areas:". u ." "l . r" ". d .";grid-template-columns:repeat(3,58px);grid-template-rows:repeat(3,50px);gap:6px;justify-content:center;margin:12px auto 0;touch-action:none}

/* ===================== 유틸 ===================== */
const app = document.getElementById('app');
const $el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = (s, v = {}) => String(s).replace(/\{(\w+)\}/g, (m, k) => (v[k] != null ? v[k] : m));
const art = (key, emoji) => IMAGES[key] ? `<img class="art" src="${IMAGES[key]}" alt="">` : emoji;
// 주인공 기본 그림: 20대 간호사 (긴 머리 · 리본 핀 · 민트 스크럽). IMAGES.hero 에 사진 넣으면 그걸로 대체

</svg>`;
const STAGES = ['🏥 병원', '🚇 일원역', '🚻 승강장', '🔀 가락시장', '⚾ 8호선', '🏠 집'];
const S = { caught: 0, trains: 0, crash: 0, berry: 0, baseball: null }; // 메모리에만 저장

function btn(label, fn, cls = 'btn') { const b = $el('button', cls, label); b.type = 'button'; b.addEventListener('click', e => fn && fn(e)); return b; }

let AC = null;
function beep(f = 880, d = 0.08, type = 'sine', vol = 0.07) {
  if (!CONFIG.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(g).connect(AC.destination); o.start(); o.stop(AC.currentTime + d + 0.02);

let cleanups = [], keyHandler = null, sayBox = null;
const held = new Set();
const onCleanup = fn => cleanups.push(fn);
function later(fn, ms) { const id = setTimeout(fn, ms); onCleanup(() => clearTimeout(id)); return id; }
function go(scene) {
  cleanups.forEach(f => { try { f(); } catch (e) {} });
  cleanups = []; keyHandler = null; held.clear(); closeModal();
  app.innerHTML = ''; sayBox = null;
  scene(); window.scrollTo(0, 0);
}
function loop(fn) {
  let last = performance.now(), alive = true;
  const step = t => { if (!alive) return; const dt = Math.min(0.05, (t - last) / 1000); last = t; fn(dt, t); if (alive) requestAnimationFrame(step); };
  requestAnimationFrame(step);
  onCleanup(() => { alive = false; });
}

const KEYMAP = { w: 'ArrowUp', W: 'ArrowUp', a: 'ArrowLeft', A: 'ArrowLeft', s: 'ArrowDown', S: 'ArrowDown', d: 'ArrowRight', D: 'ArrowRight', Spacebar: ' ' };
const normKey = k => KEYMAP[k] || k;
document.addEventListener('keydown', e => {
  const k = normKey(e.key);
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Enter'].includes(k)) e.preventDefault();
  if (modalEl) {
    if (e.repeat) return;
    if (modalKey) { modalKey(k); return; }
    if (k === 'Enter' || k === ' ') { const b = modalEl.querySelector('.btn-row .btn'); b && b.click(); }
    return;

});

// 필드 좌표: x 0~160, y 0~100

function dpad(parent, dirs = ['ArrowUp', 'ArrowLeft', 'ArrowRight', 'ArrowDown'], cls = '') {

// 자물쇠: mode 'wheel'(돌리는 숫자) / 'keypad'(번호 패드) / 'symbols'(기호 순서, answer는 배열)
function codeLock({ title, answer, mode, fails, onOk, options = [] }) {
  const target = Array.isArray(answer) ? answer.join('|') : String(answer);
  if (!Array.isArray(answer)) answer = String(answer);
  closeModal();
  const back = $el('div', 'modal-back'), box = $el('div', 'modal', `<h3>${title}</h3>`);
  back.appendChild(box); document.body.appendChild(back); modalEl = back;
  const msg = $el('p', 'lock-msg', '');
  const check = v => {
    if (v === target) { beep(988, .15); closeModal(); onOk(); return; }
    beep(200, .2, 'square', .04); msg.textContent = pick(fails);
    box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
  };
  const row = $el('div', 'btn-row');
  if (mode === 'wheel') {
    const vals = Array(answer.length).fill(0), wheels = $el('div', 'wheels');
    vals.forEach((_, i) => {
      const col = $el('div', 'wheel'), num = $el('div', 'wnum', '0');
      const set = d => { vals[i] = (vals[i] + d + 10) % 10; num.textContent = vals[i]; beep(600, .03); };
      col.append(btn('▲', () => set(1), 'wbtn'), num, btn('▼', () => set(-1), 'wbtn'));
      wheels.appendChild(col);
    });
    row.append(btn('열기 🔓', () => check(vals.join('')), 'btn primary'), btn('닫기', closeModal, 'btn'));
    box.append(wheels, msg, row);
    modalKey = k => { if (k === 'Enter') check(vals.join('')); else if (k === 'Escape') closeModal(); };
  } else if (mode === 'symbols') {
    let seq = [];
    const scr = $el('div', 'pad-screen'), pad = $el('div', 'pad');
    const render = () => { scr.textContent = seq.length ? seq.join(' ') : '· '.repeat(answer.length).trim(); };
    const del = () => { seq.pop(); render(); };
    const ok = () => { const v = seq.join('|'); seq = []; render(); check(v); };
    options.forEach(o => pad.appendChild(btn(o, () => { if (seq.length < answer.length + 2) { seq.push(o); render(); beep(660, .05); } }, 'pbtn')));
    pad.append(btn('⌫', del, 'pbtn'), btn('✔', ok, 'pbtn ok'));
    render();
    row.append(btn('닫기', closeModal, 'btn'));
    box.append(scr, pad, msg, row);
    modalKey = k => { if (k === 'Backspace') del(); else if (k === 'Enter') ok(); else if (k === 'Escape') closeModal(); };
  } else {
    let entered = '';
    const scr = $el('div', 'pad-screen'), pad = $el('div', 'pad');
    const render = () => { scr.textContent = (entered + '·'.repeat(Math.max(0, answer.length - entered.length))).split('').join(' '); };
    const press = d => { if (entered.length < answer.length + 2) { entered += d; render(); beep(660, .05); } };
    const del = () => { entered = entered.slice(0, -1); render(); };
    const ok = () => { const v = entered; entered = ''; render(); check(v); };
    ['1', '2', '3', '4', '5', '6', '7', '8', '9', '⌫', '0', '✔'].forEach(c =>
      pad.appendChild(btn(c, () => (c === '⌫' ? del() : c === '✔' ? ok() : press(c)), 'pbtn' + (c === '✔' ? ' ok' : ''))));
    render();
    row.append(btn('닫기', closeModal, 'btn'));
    box.append(scr, pad, msg, row);
    modalKey = k => { if (/^[0-9]$/.test(k)) press(k); else if (k === 'Backspace') del(); else if (k === 'Enter') ok(); else if (k === 'Escape') closeModal(); };
  }
}

// 숫자 없는 벽시계 (짧은 바늘 = h)
function clockSVG(h, m) {
  let s = '<svg class="clock" viewBox="-100 -100 200 200"><circle r="92" fill="#fffaf2" stroke="#c9a77c" stroke-width="8"/>';
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6;
    s += `<line x1="${Math.sin(a) * 70}" y1="${-Math.cos(a) * 70}" x2="${Math.sin(a) * 84}" y2="${-Math.cos(a) * 84}" stroke="#7a6c8f" stroke-width="${i % 3 ? 3 : 7}" stroke-linecap="round"/>`;
  }
  s += `<line y2="-46" stroke="#3a2f4f" stroke-width="10" stroke-linecap="round" transform="rotate(${((h % 12) + m / 60) * 30})"/>`;
  s += `<line y2="-74" stroke="#e85a9b" stroke-width="5" stroke-linecap="round" transform="rotate(${m * 6})"/>`;
  return s + '<circle r="7" fill="#3a2f4f"/></svg>';
}

function sceneLobby() {
  const T = CONFIG.texts.lobby;
  const body = frame(0, T.title, T.sub, CONFIG.hints.lobby);
  const f = makeField(body, 'room-lobby action', false);
  [['🪑', 30, 9], ['🪑', 40, 9], ['🪑', 50, 9], ['🪴', 5, 8], ['🪴', 5, 92], ['🪑', 110, 92], ['🪑', 120, 92], ['🪑', 130, 92], ['🧯', 156, 9]]
    .forEach(([e, x, y]) => obj(f, x, y, e, null, 4, 'decor'));
  obj(f, 82, 7, '<small>🏥 원무과 · 수납</small>', null, 3, 'decor');
  obj(f, 152, 50, art('exitDoor', '🚪') + '<small>출구</small>', null, 9, 'exit');
  const hero = obj(f, 12, 50, art('hero', HERO_SVG), null, 7, 'actor');
  // kind: shout(위아래 왕복) / red(빨간 안경, 대각선으로 튕김) / talk(따라옴)
  const mk = (kind, x, y, v, vx = 0) => {
    const face = kind === 'talk' ? art('patient', '🧓') : art('shouter', '😤');
    const n = obj(f, x, y, face + (kind === 'red' ? '<span class="rg"><i></i><i></i></span>' : ''), null, 7, 'actor');
    const b = $el('div', 'bubble ' + (kind === 'talk' ? 'talk' : 'shout')); n.appendChild(b);
    return { kind, x0: x, y0: y, v, vx0: vx, n, b, x, y, vy: v, vx, li: Math.floor(Math.random() * 5) };
  };
  const npcs = [
    mk('shout', 38, 20, 55), mk('shout', 66, 80, -64), mk('shout', 100, 40, 72),
    mk('red', 84, 26, 32, 40),
    mk('talk', 128, 20, 20), mk('talk', 128, 80, 20),
  ];
  const LINES = { shout: T.shoutLines, red: T.redLines, talk: T.talkLines };
  const talk = () => npcs.forEach(n => { const L = LINES[n.kind]; n.b.textContent = L[n.li++ % L.length]; });
  talk(); const iv = setInterval(talk, 1700); onCleanup(() => clearInterval(iv));

  let P, target, paused;
  const reset = () => { P = { x: 12, y: 50 }; target = null; paused = false; npcs.forEach(n => { n.x = n.x0; n.y = n.y0; n.vy = n.v; n.vx = n.vx0; }); };
  reset();
  const aim = e => { const r = f.getBoundingClientRect(); target = { x: (e.clientX - r.left) / r.width * 160, y: (e.clientY - r.top) / r.height * 100 }; };
  f.addEventListener('pointerdown', aim);
  f.addEventListener('pointermove', e => { if (e.buttons) aim(e); });
  dpad(body);

  const SPD = 46;
  const caught = n => {
    paused = true; S.caught++; beep(220, .3, 'triangle', .08);
    modal({ shout: T.caughtShout, red: T.caughtRed, talk: T.caughtTalk }[n.kind], [{ label: T.retry, onClick: reset }]);
  };
  loop(dt => {
    if (paused || modalEl) return;
    let dx = 0, dy = 0;
    if (held.has('ArrowLeft')) dx--; if (held.has('ArrowRight')) dx++;
    if (held.has('ArrowUp')) dy--; if (held.has('ArrowDown')) dy++;
    if (dx || dy) { target = null; const l = Math.hypot(dx, dy); P.x += dx / l * SPD * dt; P.y += dy / l * SPD * dt; }
    else if (target) {
      const vx = target.x - P.x, vy = target.y - P.y, d = Math.hypot(vx, vy);
      if (d < 1) target = null; else { const s = Math.min(d, SPD * dt); P.x += vx / d * s; P.y += vy / d * s; }
    }
    P.x = clamp(P.x, 4, 156); P.y = clamp(P.y, 8, 92);
    place(hero, P.x, P.y);
    for (const n of npcs) {
      if (n.kind === 'shout') {
        n.y += n.vy * dt;
        if (n.y < 14) { n.y = 14; n.vy = Math.abs(n.vy); }
        if (n.y > 86) { n.y = 86; n.vy = -Math.abs(n.vy); }
      } else if (n.kind === 'red') {
        n.x += n.vx * dt; n.y += n.vy * dt;
        if (n.x < 28) { n.x = 28; n.vx = Math.abs(n.vx); }
        if (n.x > 136) { n.x = 136; n.vx = -Math.abs(n.vx); }
        if (n.y < 14) { n.y = 14; n.vy = Math.abs(n.vy); }
        if (n.y > 86) { n.y = 86; n.vy = -Math.abs(n.vy); }
      } else {
        const vx = P.x - n.x, vy = P.y - n.y, d = Math.hypot(vx, vy);
        if (d < 70 && d > 0) { n.x += vx / d * n.v * dt; n.y += vy / d * n.v * dt; }
      }
      place(n.n, n.x, n.y);
      if (Math.hypot(P.x - n.x, P.y - n.y) < 7.5) { caught(n); return; }
    }
    if (Math.hypot(P.x - 152, P.y - 50) < 9) {
      paused = true; beep(784, .1); beep(1046, .2);
      modal(T.win, [{ label: T.next, onClick: () => go(sceneCard) }]);
    }
  });
}

/* ===================== 4-1. 환승 표지판 퍼즐 ===================== */
function mapSVG(route, T) {
  const V = { U: [0, -1], D: [0, 1], L: [-1, 0], R: [1, 0] };
  const pts = [[0, 0]];
  route.forEach(d => { const [x, y] = pts[pts.length - 1]; pts.push([x + V[d][0], y + V[d][1]]); });
  // 미로: 정답 길 + 같은 모양의 막다른 길(2칸, 꺾임)을 섞음
  const key = p => p.join(','), used = new Set(pts.map(key)), edges = [], nodes = pts.slice(), tips = [];
  for (let i = 0; i < pts.length - 1; i++) edges.push([pts[i], pts[i + 1]]);
  const ORDER = ['L', 'R', 'U', 'D'];
  for (let i = 0; i < pts.length - 1; i++) {
    const dirs = ORDER.slice(i % 4).concat(ORDER.slice(0, i % 4));
    for (const d of dirs) {
      const [x, y] = pts[i], q1 = [x + V[d][0], y + V[d][1]];
      if (used.has(key(q1))) continue;
      used.add(key(q1)); edges.push([pts[i], q1]); nodes.push(q1);
      let tip = q1;
      for (const e of (d === 'L' || d === 'R') ? (i % 2 ? ['D', 'U'] : ['U', 'D']) : (i % 2 ? ['R', 'L'] : ['L', 'R'])) {
        const q2 = [q1[0] + V[e][0], q1[1] + V[e][1]];
        if (!used.has(key(q2))) { used.add(key(q2)); edges.push([q1, q2]); nodes.push(q2); tip = q2; break; }
      }
      tips.push(tip); break;
    }
  }
  const minX = Math.min(...nodes.map(p => p[0])), maxX = Math.max(...nodes.map(p => p[0]));
  const minY = Math.min(...nodes.map(p => p[1])), maxY = Math.max(...nodes.map(p => p[1]));
  const SC = 70, PAD = 70, tx = x => (x - minX) * SC + PAD, ty = y => (y - minY) * SC + PAD;
  const w = (maxX - minX) * SC + PAD * 2, h = (maxY - minY) * SC + PAD * 2;
  let s = `<svg class="map" viewBox="0 0 ${w} ${h}"><rect x="4" y="4" width="${w - 8}" height="${h - 8}" rx="18" fill="#fff6e8" stroke="#e7c9a0" stroke-width="3"/>`;
  edges.forEach(([a, b]) => { s += `<line x1="${tx(a[0])}" y1="${ty(a[1])}" x2="${tx(b[0])}" y2="${ty(b[1])}" stroke="#a99bd6" stroke-width="12" stroke-linecap="round"/>`; });
  const tipKeys = tips.map(key);
  nodes.forEach((p, i) => {
    const ti = tipKeys.indexOf(key(p));
    if (ti >= 0) { s += `<text x="${tx(p[0])}" y="${ty(p[1])}" font-size="28" text-anchor="middle" dominant-baseline="central">${T.deadEnds[ti % T.deadEnds.length]}</text>`; return; }
    const end = i === 0 || i === pts.length - 1;
    s += `<circle cx="${tx(p[0])}" cy="${ty(p[1])}" r="${end ? 16 : 9}" fill="${i === 0 ? '#f36f21' : i === pts.length - 1 ? '#e85a9b' : '#fff'}" stroke="#a99bd6" stroke-width="4"/>`;
  });
  const first = route[0], last = route[route.length - 1];
  const sp = pts[0], ep = pts[pts.length - 1];
  const sdy = first === 'D' ? -34 : 38, edy = last === 'D' ? 38 : -34;
  s += `<text x="${tx(sp[0])}" y="${ty(sp[1]) + sdy}" font-size="19" font-weight="700" fill="#c4560f" text-anchor="middle" dominant-baseline="central">🟠 ${T.start}</text>`;
  s += `<text x="${tx(ep[0])}" y="${ty(ep[1]) + edy}" font-size="19" font-weight="700" fill="#c23a7a" text-anchor="middle" dominant-baseline="central">🩷 ${T.end}</text>`;
  return s + '</svg>';
}

/* ===================== 4-2. 환승 통로 달리기 (액션) ===================== */
function sceneRun() {
  const T = CONFIG.texts.run, GOAL = CONFIG.runSeconds;
  const body = frame(3, T.title, T.sub, CONFIG.hints.run);
  const prog = $el('div', 'runprog', `<span>🏃‍♀️</span><div class="bar"><span></span></div><b>${T.goal}</b>`);
  body.appendChild(prog);
  const bar = prog.querySelector('.bar span');
  const f = makeField(body, 'tunnel action', false);
  const LY = [25, 50, 75], PX = 24;
  const hero = obj(f, PX, 50, art('hero', HERO_SVG), null, 8, 'actor');
  let lane = 1, py = 50, obs = [], t = 0, spawnT = 1, paused = false;
  const reset = () => { obs.forEach(o => o.n.remove()); obs = []; lane = 1; py = 50; t = 0; spawnT = 1; paused = false; safe = 1; };
  const move = d => { if (paused || modalEl) return; lane = clamp(lane + d, 0, 2); };
  keyHandler = k => { if (k === 'ArrowUp') move(-1); if (k === 'ArrowDown') move(1); };
  f.addEventListener('pointerdown', e => { const r = f.getBoundingClientRect(); move((e.clientY - r.top) / r.height * 100 < py ? -1 : 1); });
  dpad(body, ['ArrowUp', 'ArrowDown'], 'ud');

  const mkObs = (ln, info, berry) => {
    const html = berry ? '🍓' : info.e === '🍉' ? '<span class="spin">🍉</span>' : info.e;
    return { x: 172, lane: ln, info, berry, n: obj(f, 172, LY[ln], html, null, berry ? 5 : 7, 'actor') };
  };
  // 웨이브마다 '안전한 줄' 1개는 항상 비워둠 (3줄 동시 막힘 방지).
  // 안전한 줄은 직전 안전한 줄에서 최대 1칸만 이동 → 항상 피할 길이 이어짐
  let safe = 1;
  const spawnWave = () => {
    safe = clamp(safe + pick([-1, 0, 0, 1]), 0, 2);
    const others = [0, 1, 2].filter(l => l !== safe).sort(() => Math.random() - .5), count = Math.random() < .45 ? 2 : 1;
    for (let i = 0; i < count; i++) obs.push(mkObs(others[i], pick(T.obstacles), false));
    if (Math.random() < .35) obs.push(mkObs(safe, null, true));
  };
  const crash = o => {
    paused = true; S.crash++; beep(180, .25, 'square', .05);
    modal(fmt(T.crash, { e: o.info.e, n: o.info.n }), [{ label: T.retry, onClick: reset }]);
  };
  loop(dt => {
    if (paused || modalEl) return;
    t += dt;
    const speed = 65 + t * 2.2;
    py += (LY[lane] - py) * Math.min(1, dt * 14);
    place(hero, PX, py);
    spawnT -= dt;
    if (spawnT <= 0 && t < GOAL - 1.5) { spawnT = 0.95 - Math.min(.2, t * .012); spawnWave(); }
    for (const o of obs) {
      o.x -= speed * dt; place(o.n, o.x, LY[o.lane]);
      if (o.dead || Math.abs(o.x - PX) > 7 || Math.abs(LY[o.lane] - py) > 11) continue;
      if (o.berry) { o.dead = true; o.n.remove(); S.berry++; beep(1200, .06); }
      else { crash(o); return; }
    }
    obs = obs.filter(o => { if (o.dead) return false; if (o.x < -10) { o.n.remove(); return false; } return true; });
    bar.style.width = Math.min(100, t / GOAL * 100) + '%';
    if (t >= GOAL) { paused = true; beep(784, .1); beep(1046, .25); modal(T.ok, [{ label: T.next, onClick: () => go(sceneBaseball) }]); }
  });
}

  let combo = 0, best = 0, sam = 0, opp = 0, hHits = 0, hMiss = 0, oppRunsHalf = 0;

  const cast = txt => { castEl.innerHTML = txt; };
  const judge = txt => { judgeEl.textContent = txt; judgeEl.classList.remove('pop'); void judgeEl.offsetWidth; judgeEl.classList.add('pop'); };
  const showCombo = () => { comboEl.textContent = combo >= 2 ? `${combo} COMBO` : ''; };
  const score = () => { scS.textContent = sam; scO.textContent = opp; [scS, scO].forEach(e => { e.classList.remove('bump'); void e.offsetWidth; e.classList.add('bump'); }); };
  const anim = (el, cls) => { el.classList.remove('fly', 'hr', 'show'); void el.offsetWidth; el.classList.add(cls); };
  const fx = emoji => { fxEl.textContent = emoji; anim(fxEl, 'show'); };
  const setSprites = bat => { batterEl.innerHTML = pix(PIX_BATTER, teamPal(bat)); pitcherEl.innerHTML = pix(PIX_PITCHER, teamPal(bat === 'sam' ? 'opp' : 'sam')); };
  setSprites('opp');

  function startHalf(h) {
    combo = 0; hHits = 0; hMiss = 0; oppRunsHalf = 0; showCombo(); b1.classList.remove('on');
    const inn = Math.floor(h / 2) + 1, top = h % 2 === 0;
    innEl.textContent = `${inn}회${top ? '초' : '말'}`;
    cast(fmt(top ? T.topStart : T.botStart, { n: inn, opp: CONFIG.opponentShort }));
    setSprites(top ? 'opp' : 'sam');
    lane.classList.toggle('def', top); lane.classList.toggle('att', !top);
    if (h === 2) { annEl.textContent = T.songpa; stEls[1].classList.add('on'); }
    if (h === 4) annEl.textContent = T.seokchon;
  }
  function onHit(n) {
    combo++; best = Math.max(best, combo); showCombo();
    if (n.h % 2 === 1) {
      if (combo % 4 === 0) {
        hHits++;
        if (hHits === 1) { cast(T.single); anim(ballEl, 'fly'); b1.classList.add('on'); beep(1318, .12); }
        else if (hHits === 2) { sam += 1; score(); cast(T.double); anim(ballEl, 'fly'); beep(1318, .15); }
        else { sam += 2; score(); cast(T.homer); anim(ballEl, 'hr'); fx('🎆'); b1.classList.remove('on'); beep(1568, .3); }
      }
    } else if (combo % 4 === 0) { cast(pick(T.strikeout)); fx('🔥'); }
  }
  function onMiss(n) {
    combo = 0; showCombo(); n.n.classList.add('miss'); judge(T.miss);
    if (n.h % 2 === 1) { cast(pick(T.samOut)); return; }
    hMiss++;
    if (hMiss === 1) { cast(T.oppHit); anim(ballEl, 'fly'); }
    else if (oppRunsHalf < B.maxOppRunsPerHalf) { opp++; oppRunsHalf++; score(); cast(T.oppRun); fx('😭'); beep(260, .2, 'triangle'); }
  }
  function press(side) {
    if (!running || ended || modalEl) return;
    const ring = rings[side]; ring.classList.remove('pulse'); void ring.offsetWidth; ring.classList.add('pulse');
    const now = performance.now() - t0;
    let hit = null, bd = 1e9;
    for (const n of notes) {
      if (n.done || n.side !== side) continue;
      if (n.t - now > B.goodMs) break;
      const d = Math.abs(n.t - now); if (d <= B.goodMs && d < bd) { bd = d; hit = n; }
    }
    if (hit) {
      hit.done = true; hit.n.classList.add('hit');
      judge(bd <= B.perfectMs ? 'PERFECT!' : 'GOOD!'); beep(side ? 330 : 880, .07, side ? 'triangle' : 'sine', .08); onHit(hit);
    } else if (now >= 0) { combo = 0; showCombo(); judge(T.wrong); beep(150, .05, 'square', .03); }  // 헛누르기 = 콤보 끊김
  }
  function finish() {
    running = false;
    stEls.forEach(e => e.classList.add('on')); annEl.textContent = T.arrive;
    const result = sam > opp ? 'win' : sam < opp ? 'lose' : 'tie';
    S.baseball = { sam, opp, result };
    cast(CONFIG.ending[result]);
    later(() => modal(`<h3>${T.finalTitle}</h3><div class="final-score">${CONFIG.samsungShort} ${sam} : ${opp} ${CONFIG.opponentShort}</div>
      <p>${CONFIG.ending[result]}</p><p class="small" style="color:#7a6c8f">${fmt(T.maxCombo, { n: best })}</p>`,
      [{ label: T.next, onClick: () => go(sceneDoor) }]), 1200);
  }
  loop(() => {
    if (!running) return;
    if (modalEl) { if (!pausedAt) pausedAt = performance.now(); return; }   // 힌트 보는 동안 일시정지
    if (pausedAt) { t0 += performance.now() - pausedAt; pausedAt = 0; }
    const now = performance.now() - t0;
    if (now < 0) judgeEl.textContent = Math.ceil(-now / 1000);
    else if (judgeEl.textContent.match(/^\d$/)) judgeEl.textContent = '';
    const hh = clamp(Math.floor((now + 1.5 * BEAT) / HALF_LEN), 0, HALVES - 1);
    if (hh !== curHalf) { curHalf = hh; startHalf(hh); }
    const bi = Math.floor(now / BEAT);   // 메트로놈
    if (now >= 0 && bi > lastTick && bi * BEAT < END) { lastTick = bi; beep(bi % (PER + GAP) === 0 ? 660 : 440, .03, 'triangle', .03); }
    for (const n of notes) {
      const dt = n.t - now;
      if (!n.done && dt < -(B.goodMs + 20)) { n.done = true; onMiss(n); }
      const vis = dt > -250 && dt < VIEW;
      n.n.style.display = vis ? 'grid' : 'none';
      if (vis) n.n.style.left = (HIT + dt / VIEW * (100 - HIT)) + '%';
    }
    if (now > END && !ended) { ended = true; finish(); }
  });
  bL.addEventListener('pointerdown', e => { e.preventDefault(); press(0); });
  bR.addEventListener('pointerdown', e => { e.preventDefault(); press(1); });
  lane.addEventListener('pointerdown', e => { e.preventDefault(); const r = lane.getBoundingClientRect(); press(e.clientY - r.top < r.height / 2 ? 0 : 1); });
  keyHandler = k => {
    if (['ArrowLeft', 'ArrowUp', 'f', 'F', 'ㄹ'].includes(k)) press(0);
    else if (['ArrowRight', 'ArrowDown', 'j', 'J', 'ㅓ'].includes(k)) press(1);
  };
  modal(fmt(T.intro, { sam: CONFIG.samsungTeam, opp: CONFIG.opponentTeam }),
    [{ label: T.startBtn, onClick: () => { beep(660, .05); t0 = performance.now() + 3000; running = true; } }]);
}

/* ===================== 6. 집 앞 도어락 ===================== */
// 도어락 숫자(⭐🐈🪴📦 개수)만큼 아래 좌표에 순서대로 배치됨 (각 최대 9개)
const DOOR_POS = {
  star:  [[12, 10], [30, 22], [46, 6], [116, 20], [128, 5], [154, 26], [22, 34], [112, 38], [8, 46]],
  cat:   [[30, 63], [140, 58], [14, 58], [44, 92], [154, 92], [120, 58], [6, 92], [124, 95], [109, 58]],
  plant: [[68, 88], [22, 90], [132, 90], [58, 88], [142, 80], [34, 80], [110, 82], [150, 70], [10, 74]],
  box:   [[90, 92], [97, 92], [93.5, 86], [104, 92], [100.5, 86], [97, 80], [111, 93], [84, 96], [117, 86]],
};
function sceneDoor() {
  const T = CONFIG.texts.door, code = String(CONFIG.answers.door);
  const body = frame(5, T.title, T.sub, CONFIG.hints.door);
  const f = makeField(body, 'house-front');
  // 빌라: 2~4층 창문(불 켜진 집 / 꺼진 집, 일부 발코니) + 1층 필로티 주차장
  const wins = ['on rail', '', 'on', '', 'on rail', '', 'on', 'on', 'rail'].map(c => `<div class="vw ${c}"></div>`).join('');
  f.insertAdjacentHTML('beforeend', `<div class="villa"><div class="tank"></div><div class="vroof"></div><div class="floors">${wins}</div>
    <div class="plate">${T.villaName}</div><div class="piloti"><i></i><i></i><i></i><i></i></div></div>
    <div class="fence fl"></div><div class="fence fr"></div><div class="lamp-post"><div class="lamp-head"></div></div>`);
  obj(f, 140, 12, '🌙', () => say(T.moon), 8);
  [['star', '⭐', 5, () => T.star], ['cat', '🐈', 7, () => pick(T.cat)], ['plant', '🪴', 6, () => T.plant], ['box', '📦', 5, () => T.box]]
    .forEach(([k, e, size, line], ki) => {
      const n = clamp(parseInt(code[ki] || '0', 10) || 0, 0, 9);
      for (let i = 0; i < n; i++) {
        const [x, y] = DOOR_POS[k][i];
        if (k === 'cat' && i === 0) obj(f, x, y, '🐱', () => say(T.peek), 5, 'peek');
        else obj(f, x, y, k === 'cat' && i === 1 ? '🐈‍⬛' : e, () => say(line()), size);
      }
    });
  // 세면 안 되는 헷갈림 소품
  [['🌟', 40, 16, T.shine, 5], ['🌟', 132, 40, T.shine, 4], ['🐕', 130, 74, T.dog, 6], ['🎁', 74, 96, T.gift, 5]]
    .forEach(([e, x, y, line, size]) => obj(f, x, y, e, () => say(line), size));
  obj(f, 48, 74, `📫<small>${T.mailLabel}</small>`, () => say(T.mail), 6);
  let opened = false;
  const door = obj(f, 80, 73, `<div class="door-frame"><div class="door"><span class="dl">🔢</span></div></div><small>${T.doorLabel}</small>`, () => {
    if (opened) return;
    codeLock({
      title: T.lockTitle, answer: code, mode: 'keypad', fails: T.lockFails,
      onOk: () => {
        opened = true; door.querySelector('.door').classList.add('open'); say(T.open);
        beep(784, .12); later(() => beep(988, .12), 150); later(() => beep(1318, .3), 300);
        later(() => go(sceneEnding), 1700);
      },
    });
  }, 3);
}

/* ===================== 엔딩 ===================== */
function sceneEnding() {
  const E = CONFIG.ending, bb = S.baseball || { sam: 0, opp: 0, result: 'tie' };
  const w = $el('div', 'ending', `
    <div class="room-warm">
      <div class="home-row"><span>🛋️</span><span class="big">${art('hero', HERO_SVG)}</span><span>🧸</span></div>
      <div class="home-row s"><span>🍜</span><span>🧦</span><span>🐈</span><span>🛏️</span><span>💡</span></div>
    </div>
    <h1>${E.title}</h1>
    <div class="bb-result">⚾ ${CONFIG.samsungShort} <b>${bb.sam}</b> : <b>${bb.opp}</b> ${CONFIG.opponentShort}<br><b>${E[bb.result]}</b></div>
    ${IMAGES.endingPhoto ? `<img class="photo" src="${IMAGES.endingPhoto}" alt="">` : ''}
    <p class="small">${fmt(E.stats, S)}</p>`);
  w.appendChild(btn(E.restart, () => { Object.assign(S, { caught: 0, trains: 0, crash: 0, berry: 0, baseball: null }); go(sceneTitle); }, 'btn primary big'));
  app.appendChild(w);
  const iv = setInterval(() => {
    const h = $el('div', 'heart', pick(['💙', '🩷', '✨', '🧡']));
    h.style.left = Math.random() * 95 + 'vw'; h.style.animationDuration = 4 + Math.random() * 3 + 's';
    document.body.appendChild(h); setTimeout(() => h.remove(), 7500);
  }, 450);
  onCleanup(() => clearInterval(iv));
  [523, 659, 784, 1046].forEach((fq, i) => later(() => beep(fq, .25), i * 160));
}

/* ===================== 시작 ===================== */
// 테스트용: 주소 끝에 #lobby, #toilet, #baseball, #door 등을 붙이면 그 스테이지부터 시작
const SCENES = { title: sceneTitle, locker: sceneLocker, lobby: sceneLobby, card: sceneCard, gate: sceneGate, toilet: sceneToilet,
  transfer: sceneTransfer, run: sceneRun, baseball: sceneBaseball, door: sceneDoor, ending: sceneEnding };
go(SCENES[location.hash.slice(1)] || sceneTitle);
</script>
